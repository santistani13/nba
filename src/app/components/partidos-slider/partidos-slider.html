<div class="strip">
  <div class="strip-label">
    <span class="dot"></span>
    <span class="label-text">HOY · {{ today }}</span>
  </div>

  <div class="marquee-wrap">
    @if (loading()) {
      <div class="marquee-track skeleton-track">
        @for (slot of skeletonSlots; track slot) {
          <div class="game-card skeleton-card">
            <span class="skeleton-line skeleton-abbr"></span>
            <span class="skeleton-line skeleton-vs"></span>
            <span class="skeleton-line skeleton-abbr"></span>
          </div>
        }
      </div>
    } @else {
      <div class="marquee-track">
        @for (game of gamesDisplay(); track $index) {
          <div class="game-card">
            <div class="team">
              <span class="abbr">{{ game.away.abbr }}</span>
              <span class="team-name">{{ game.away.name }}</span>
            </div>
            <div class="vs-block">
              <span class="vs">VS</span>
              <span class="time">{{ game.time }}</span>
            </div>
            <div class="team">
              <span class="abbr">{{ game.home.abbr }}</span>
              <span class="team-name">{{ game.home.name }}</span>
            </div>
          </div>
        } @empty {
          <span class="no-games">No hay partidos para mostrar</span>
        }
      </div>
    }
  </div>
</div>
